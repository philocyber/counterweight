services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-counterweight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-counterweight}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-counterweight} -d ${POSTGRES_DB:-counterweight}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  counterweight:
    build:
      context: .
    image: counterweight:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      COUNTERWEIGHT_LANGUAGE: ${COUNTERWEIGHT_LANGUAGE:-en}
      COUNTERWEIGHT_PG_DSN: postgres://${POSTGRES_USER:-counterweight}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-counterweight}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COUNTERWEIGHT_LLM_PROVIDER: ${COUNTERWEIGHT_LLM_PROVIDER:-}
      COUNTERWEIGHT_LLM_MODEL: ${COUNTERWEIGHT_LLM_MODEL:-}
      COUNTERWEIGHT_LLM_BASE_URL: ${COUNTERWEIGHT_LLM_BASE_URL:-}
      COUNTERWEIGHT_LLM_PROXY: ${COUNTERWEIGHT_LLM_PROXY:-}
      COUNTERWEIGHT_TRAFFIC_BLOB_BYTES: ${COUNTERWEIGHT_TRAFFIC_BLOB_BYTES:-1073741824}
      COUNTERWEIGHT_TRAFFIC_INDEX_BYTES: ${COUNTERWEIGHT_TRAFFIC_INDEX_BYTES:-1073741824}
      COUNTERWEIGHT_TRAFFIC_WAL_BYTES: ${COUNTERWEIGHT_TRAFFIC_WAL_BYTES:-134217728}
      COUNTERWEIGHT_TRAFFIC_FREE_BYTES: ${COUNTERWEIGHT_TRAFFIC_FREE_BYTES:-268435456}
      COUNTERWEIGHT_TRAFFIC_EXCHANGE_BYTES: ${COUNTERWEIGHT_TRAFFIC_EXCHANGE_BYTES:-67108864}
      COUNTERWEIGHT_TRAFFIC_HOST_BYTES: ${COUNTERWEIGHT_TRAFFIC_HOST_BYTES:-268435456}
      COUNTERWEIGHT_TRAFFIC_MAX_EXCHANGES: ${COUNTERWEIGHT_TRAFFIC_MAX_EXCHANGES:-100000}
      COUNTERWEIGHT_TASK_ARCHIVE_BYTES: ${COUNTERWEIGHT_TASK_ARCHIVE_BYTES:-4294967296}
      COUNTERWEIGHT_PROXY_CLIENT_CIDRS: ${COUNTERWEIGHT_PROXY_CLIENT_CIDRS:-}
      # The session signing key and the key that encrypts stored credentials live on
      # their own volume, outside the data directory agents and the file browser can read.
      COUNTERWEIGHT_KEY_DIR: /app/keys
    # Lets a profile reach a model server running on the Docker host (for example a
    # local Ollama) at http://host.docker.internal:<port>/v1, on Linux as on Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
      - ./tls:/app/tls:ro
      - keys:/app/keys
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS -m 4 https://localhost:8787/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  keys:
