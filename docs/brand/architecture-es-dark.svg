<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Arquitectura de Counterweight</title>
<desc id="d">Un operador, un workflow de CI o un agente de código llegan al servidor de Counterweight. Dentro, la consola y la API entregan el trabajo al motor de agentes. Los agentes que prueban aplicaciones en ejecución pasan por la compuerta de aprobación, el aislamiento de ejecución y un proxy de grabación opcional antes de llegar a los objetivos autorizados. Los agentes que revisan código fuente solo lo leen; después vienen las pistas de los escáneres, un verificador independiente y la corrección, que llega a GitHub como pull request. Los hallazgos se convierten en informes y tickets de Jira. Cada agente llama al proveedor de modelos que conectes. Los datos quedan en PostgreSQL, el directorio de datos y un directorio de claves separado.</desc>
