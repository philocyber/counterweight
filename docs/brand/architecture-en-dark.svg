<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Counterweight architecture</title>
<desc id="d">An operator, a CI workflow or a coding agent reaches the Counterweight server. Inside it, the console and API hand work to the agent engine. Agents that test running applications pass through the approval gate, execution isolation and an optional recording proxy before reaching authorized targets. Agents that review source code only read it; scanner leads, an independent verifier and a fix step follow, and fixes go to GitHub as pull requests. Findings become reports and Jira tickets. Every agent calls the model provider you connect. Data stays in PostgreSQL, the data directory and a separate key directory.</desc>
